<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Markdown Notes</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside class="sidebar">
      <header>
        <h1>Notes</h1>
        <button id="new-note" class="btn" title="New note">+ New</button>
      </header>
      <ul id="note-list"></ul>
      <footer>saved locally · no account</footer>
    </aside>

    <main class="editor-pane">
      <div class="toolbar">
        <input id="note-title" placeholder="Untitled note" autocomplete="off" />
        <button id="export" class="btn ghost" title="Download as .md">Export</button>
        <button id="delete" class="btn ghost danger" title="Delete note">Delete</button>
      </div>
      <div class="split">
        <textarea id="note-body" placeholder="# Write markdown here…" spellcheck="false"></textarea>
        <article id="preview" class="preview"></article>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
