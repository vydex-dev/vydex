<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CSS Loaders Pack — demo</title>
    <link rel="stylesheet" href="loaders.css" />
    <style>
      * { margin: 0; box-sizing: border-box; }
      body { background: #101014; color: #ecebf2; font-family: ui-monospace, "Cascadia Code", monospace; padding: 40px 20px; }
      .demo { max-width: 760px; margin: 0 auto; }
      h1 { font-size: 24px; text-transform: uppercase; letter-spacing: 0.06em; }
      h1 + p { color: #8f8fa3; margin: 8px 0 28px; font-size: 14px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
      .tile {
        border: 2px solid #2c2c38; background: #17171d;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        padding: 28px 12px; cursor: pointer; transition: border-color 0.15s;
        min-height: 140px; color: #ffd23f;
      }
      .tile:hover { border-color: #ffd23f; }
      .tile span { font-size: 11px; color: #8f8fa3; }
      .tile.copied span { color: #58e07e; }
      .hint { margin-top: 20px; color: #8f8fa3; font-size: 12px; }
      code { color: #ffd23f; }
    </style>
  </head>
  <body>
    <div class="demo">
      <h1>CSS Loaders Pack</h1>
      <p>8 spinners, one CSS file, zero JS required. Click a tile to copy its HTML.</p>

      <div class="grid" id="grid">
        <div class="tile" data-name="ring"><div class="ld ld-ring"></div><span>.ld-ring</span></div>
        <div class="tile" data-name="dots"><div class="ld ld-dots"></div><span>.ld-dots</span></div>
        <div class="tile" data-name="bars"><div class="ld ld-bars"></div><span>.ld-bars</span></div>
        <div class="tile" data-name="pixel"><div class="ld ld-pixel"></div><span>.ld-pixel</span></div>
        <div class="tile" data-name="dual"><div class="ld ld-dual"></div><span>.ld-dual</span></div>
        <div class="tile" data-name="flip"><div class="ld ld-flip"></div><span>.ld-flip</span></div>
        <div class="tile" data-name="pulse"><div class="ld ld-pulse"></div><span>.ld-pulse</span></div>
        <div class="tile" data-name="type"><div class="ld ld-type">loading</div><span>.ld-type</span></div>
      </div>

      <p class="hint">
        Size &amp; color: <code>style="--ld-size: 48px; color: hotpink"</code> — loaders inherit <code>currentColor</code>.
      </p>
    </div>

    <script>
      // Demo-only: click a tile to copy the loader's HTML snippet.
      document.getElementById('grid').addEventListener('click', async (e) => {
        const tile = e.target.closest('.tile')
        if (!tile) return
        const name = tile.dataset.name
        const snippet = name === 'type'
          ? '<div class="ld ld-type">loading</div>'
          : `<div class="ld ld-${name}"></div>`
        try {
          await navigator.clipboard.writeText(snippet)
          const label = tile.querySelector('span')
          const prev = label.textContent
          label.textContent = 'copied!'
          tile.classList.add('copied')
          setTimeout(() => { label.textContent = prev; tile.classList.remove('copied') }, 900)
        } catch { /* clipboard blocked */ }
      })
    </script>
  </body>
</html>
